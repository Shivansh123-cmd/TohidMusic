name: TohidMusic Controller

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: tohidmusic-controller
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Safe bot watchdog and session handover
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          BOT_WORKFLOW="run-bot.yml"
          CONTROLLER_WORKFLOW="bot-controller.yml"
          BRANCH="dev"

          BOT_HANDOVER_MINUTES=335
          CONTROLLER_HANDOVER_MINUTES=335

          controller_started="$(date -u +%s)"

          echo "========================================"
          echo "TohidMusic Controller started"
          echo "Single Telegram assistant session mode"
          echo "Duplicate-run protection: ENABLED"
          echo "========================================"


          # ============================================================
          # GET ALL BOT RUNS
          # ============================================================

          get_bot_runs() {
            gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/workflows/$BOT_WORKFLOW/runs?branch=$BRANCH&per_page=100" \
              --jq '.workflow_runs[]' |
            jq -s '
              [
                .[] |
                {
                  id: .id,
                  status: .status,
                  conclusion: .conclusion,
                  created_at: .created_at,
                  run_number: .run_number
                }
              ]
            '
          }


          # ============================================================
          # ACTIVE BOT RUNS
          # ============================================================

          get_active_bots() {
            get_bot_runs |
            jq '
              [
                .[] |
                select(
                  .status == "queued"
                  or .status == "in_progress"
                  or .status == "waiting"
                  or .status == "pending"
                  or .status == "requested"
                )
              ] |
              sort_by(.created_at)
            '
          }


          # ============================================================
          # BOT READY CHECK
          # ============================================================

          bot_is_ready() {
            local run_id="$1"

            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/runs/$run_id/jobs?per_page=100" |
            jq -e '
              [
                .jobs[]?.steps[]?
                | select(
                    .name == "Verify bot ready"
                    and .conclusion == "success"
                  )
              ] |
              length > 0
            ' >/dev/null
          }


          # ============================================================
          # CANCEL BOT
          # ============================================================

          cancel_bot() {
            local run_id="$1"

            echo "Cancelling bot run #$run_id"

            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/runs/$run_id/cancel" \
              >/dev/null || true
          }


          # ============================================================
          # WAIT FOR COMPLETE STOP
          # ============================================================

          wait_until_completed() {
            local run_id="$1"

            echo "Waiting for bot run #$run_id to completely stop..."

            for attempt in $(seq 1 72); do

              status="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/$REPO/actions/runs/$run_id" \
                  --jq '.status' 2>/dev/null || echo "unknown"
              )"

              echo "Run #$run_id status: $status"

              if [[ "$status" == "completed" ]]; then
                echo "Run #$run_id completely stopped."
                return 0
              fi

              sleep 5
            done

            echo "Run #$run_id did not stop within 6 minutes."
            return 1
          }


          # ============================================================
          # START BOT ONLY WHEN ZERO BOT RUNS EXIST
          # ============================================================

          start_bot_if_none() {

            active="$(get_active_bots)"
            count="$(jq -r 'length' <<< "$active")"

            echo "Current active bot runs: $count"

            if (( count > 0 )); then
              echo "A bot is already active. NOT starting another bot."
              return 0
            fi

            echo "No active bot exists."
            echo "Starting exactly ONE bot..."

            gh workflow run "$BOT_WORKFLOW" \
              --repo "$REPO" \
              --ref "$BRANCH"

            echo "Bot dispatch requested."
          }


          # ============================================================
          # SAFE HANDOVER
          # ============================================================

          safe_handover() {

            echo "========================================"
            echo "Starting SAFE bot handover"
            echo "========================================"

            active="$(get_active_bots)"
            count="$(jq -r 'length' <<< "$active")"

            if (( count == 0 )); then
              echo "No bot is running."
              start_bot_if_none
              return 0
            fi


            echo "Active bot runs before handover: $count"


            # ----------------------------------------------------------
            # Cancel every active bot.
            # This guarantees the assistant session is not shared by
            # multiple GitHub runners.
            # ----------------------------------------------------------

            jq -r '.[].id' <<< "$active" |
            while read -r run_id; do

              [[ -z "$run_id" ]] && continue

              cancel_bot "$run_id"

            done


            # ----------------------------------------------------------
            # Wait for EVERY old runner to completely finish.
            # ----------------------------------------------------------

            jq -r '.[].id' <<< "$active" |
            while read -r run_id; do

              [[ -z "$run_id" ]] && continue

              if ! wait_until_completed "$run_id"; then
                echo "Old bot #$run_id is still active."
                echo "NOT starting a successor."
                return 1
              fi

            done


            # ----------------------------------------------------------
            # Final verification.
            # ----------------------------------------------------------

            sleep 5

            remaining="$(get_active_bots)"
            remaining_count="$(jq -r 'length' <<< "$remaining")"

            echo "Active bots after handover: $remaining_count"


            if (( remaining_count != 0 )); then
              echo "A bot runner is still active."
              echo "Successor will NOT be started."
              return 1
            fi


            # ----------------------------------------------------------
            # NOW it is safe to start the next assistant session.
            # ----------------------------------------------------------

            echo "All old bot runners are completely stopped."
            echo "Starting exactly ONE successor bot."

            start_bot_if_none
          }


          # ============================================================
          # MAIN LOOP
          # ============================================================

          while true; do

            echo ""
            echo "========================================"
            echo "Controller check"
            echo "========================================"


            # ----------------------------------------------------------
            # CONTROLLER AGE
            # ----------------------------------------------------------

            now="$(date -u +%s)"

            controller_age_minutes=$(
              (now - controller_started) / 60
            )

            echo "Controller age: ${controller_age_minutes} minutes"


            # ----------------------------------------------------------
            # CONTROLLER HANDOVER
            # ----------------------------------------------------------

            if (( controller_age_minutes >= CONTROLLER_HANDOVER_MINUTES )); then

              echo "Controller reached 335 minutes."

              echo "Starting successor controller FIRST."

              gh workflow run "$CONTROLLER_WORKFLOW" \
                --repo "$REPO" \
                --ref "$BRANCH"

              echo "Successor controller started."
              echo "Current controller exiting."

              exit 0
            fi


            # ----------------------------------------------------------
            # CHECK ACTIVE BOTS
            # ----------------------------------------------------------

            active="$(get_active_bots)"
            count="$(jq -r 'length' <<< "$active")"

            echo "Active bot runs: $count"


            # ----------------------------------------------------------
            # NO BOT
            # ----------------------------------------------------------

            if (( count == 0 )); then

              echo "No active bot found."

              start_bot_if_none

              sleep 30
              continue
            fi


            # ----------------------------------------------------------
            # MORE THAN ONE BOT
            # ----------------------------------------------------------

            if (( count > 1 )); then

              echo "WARNING: Multiple bot runs detected."
              echo "Protecting the Telegram assistant session."


              # Keep the newest run only.
              newest_id="$(jq -r 'last.id' <<< "$active")"

              echo "Newest run to inspect: $newest_id"


              jq -r \
                --arg keep "$newest_id" \
                '.[] |
                 select((.id | tostring) != $keep) |
                 .id' \
                <<< "$active" |
              while read -r old_id; do

                [[ -z "$old_id" ]] && continue

                cancel_bot "$old_id"

              done


              sleep 10

              continue
            fi


            # ----------------------------------------------------------
            # EXACTLY ONE BOT
            # ----------------------------------------------------------

            newest="$(jq -c 'last' <<< "$active")"

            newest_id="$(jq -r '.id // empty' <<< "$newest")"
            newest_number="$(jq -r '.run_number // empty' <<< "$newest")"
            newest_created="$(jq -r '.created_at // empty' <<< "$newest")"


            if [[ -z "$newest_id" || -z "$newest_created" ]]; then

              echo "Invalid bot information."
              sleep 30
              continue

            fi


            echo "Bot #$newest_number is the only active bot."


            # ----------------------------------------------------------
            # READY
            # ----------------------------------------------------------

            if bot_is_ready "$newest_id"; then

              echo "Bot #$newest_number is READY."
              echo "Keeping it alive."

            else

              echo "Bot #$newest_number is not READY yet."

              now="$(date -u +%s)"
              created="$(date -u -d "$newest_created" +%s)"

              age_minutes=$(( (now - created) / 60 ))

              echo "Bot age: ${age_minutes} minutes"


              # --------------------------------------------------------
              # If startup is stuck for 335 minutes, perform safe
              # handover. Old runner is stopped BEFORE successor starts.
              # --------------------------------------------------------

              if (( age_minutes >= BOT_HANDOVER_MINUTES )); then

                safe_handover

              fi

            fi


            sleep 30

          done
