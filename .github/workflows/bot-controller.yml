name: TohidMusic Controller

on:
  workflow_run:
    workflows: ["Run TohidMusic"]
    types: [requested, in_progress, completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Reconcile bot runners
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          WORKFLOW="run-bot.yml"
          BRANCH="dev"

          list_runs() {
            gh api --paginate               -H "Accept: application/vnd.github+json"               "/repos/$REPO/actions/workflows/$WORKFLOW/runs?branch=$BRANCH&per_page=100"               --jq '.workflow_runs[] | {id, status, conclusion, created_at, run_number}'               2>/dev/null
          }

          latest_run_json() {
            list_runs | jq -s 'sort_by(.created_at) | last // empty'
          }

          active_runs_json() {
            list_runs | jq -s '
              map(select(
                .status == "queued" or
                .status == "in_progress" or
                .status == "waiting" or
                .status == "pending" or
                .status == "requested"
              ))
              | sort_by(.created_at)
            '
          }

          dispatch_new() {
            echo "No usable active bot run exists; dispatching a replacement."
            gh workflow run "$WORKFLOW" --repo "$REPO" --ref "$BRANCH"
          }

          latest="$(latest_run_json || true)"

          if [[ -z "$latest" ]]; then
            dispatch_new
            exit 0
          fi

          latest_id="$(jq -r '.id' <<<"$latest")"
          latest_status="$(jq -r '.status' <<<"$latest")"

          echo "Latest Run #$(jq -r '.run_number' <<<"$latest") ($latest_id) status=$latest_status"

          if [[ "$latest_status" != "queued" && "$latest_status" != "in_progress" && "$latest_status" != "waiting" && "$latest_status" != "pending" && "$latest_status" != "requested" ]]; then
            dispatch_new
            exit 0
          fi

          for attempt in $(seq 1 60); do
            active="$(active_runs_json)"
            count="$(jq 'length' <<<"$active")"

            if (( count == 0 )); then
              dispatch_new
              exit 0
            fi

            newest="$(jq 'last' <<<"$active")"
            target_id="$(jq -r '.id' <<<"$newest")"
            target_number="$(jq -r '.run_number' <<<"$newest")"

            echo "Current newest active run: #$target_number ($target_id)"

            jobs="$(gh api               -H "Accept: application/vnd.github+json"               "/repos/$REPO/actions/runs/$target_id/jobs?per_page=100")"

            ready_count="$(jq '[.jobs[].steps[]? | select(.name == "Verify bot ready" and .conclusion == "success")] | length' <<<"$jobs")"

            if (( ready_count > 0 )); then
              latest_now="$(latest_run_json || true)"

              if [[ -n "$latest_now" && "$(jq -r '.id' <<<"$latest_now")" == "$target_id" ]]; then
                echo "Newest run #$target_number is verified READY. Cleaning up every other active run."

                active="$(active_runs_json)"
                jq -r --arg target "$target_id" '.[] | select((.id|tostring) != $target) | .id' <<<"$active" |
                while read -r old_id; do
                  [[ -z "$old_id" ]] && continue
                  echo "Cancelling old/duplicate run $old_id"
                  gh api --method POST                     -H "Accept: application/vnd.github+json"                     "/repos/$REPO/actions/runs/$old_id/cancel" >/dev/null || true
                done

                sleep 10

                active="$(active_runs_json)"
                jq -r --arg target "$target_id" '.[] | select((.id|tostring) != $target) | .id' <<<"$active" |
                while read -r old_id; do
                  [[ -z "$old_id" ]] && continue
                  echo "Force-cancelling remaining old/duplicate run $old_id"
                  gh api --method POST                     -H "Accept: application/vnd.github+json"                     "/repos/$REPO/actions/runs/$old_id/force-cancel" >/dev/null || true
                done

                echo "Run #$target_number is now the selected active bot."
                exit 0
              fi
            fi

            sleep 10
          done

          echo "Controller timed out while waiting for the newest run to become ready."
          echo "The 5-minute scheduled controller will retry automatically."
