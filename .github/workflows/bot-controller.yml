name: TohidMusic Controller

on:
  workflow_run:
    workflows: ["Run TohidMusic"]
    types: [completed]

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: tohidmusic-controller
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Watch, restart and hand over controller
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          WORKFLOW="run-bot.yml"
          CONTROLLER_WORKFLOW="bot-controller.yml"
          BRANCH="dev"

          BOT_HANDOVER_MINUTES=335
          CONTROLLER_HANDOVER_MINUTES=335

          controller_started="$(date -u +%s)"
          controller_handover_done="false"


          # ============================================================
          # DISPATCH BOT
          # ============================================================

          dispatch_bot() {
            echo "----------------------------------------"
            echo "Dispatching new bot..."
            echo "----------------------------------------"

            gh workflow run "$WORKFLOW" \
              --repo "$REPO" \
              --ref "$BRANCH"

            echo "Bot dispatch requested."
          }


          # ============================================================
          # DISPATCH SUCCESSOR CONTROLLER
          # ============================================================

          dispatch_controller() {
            if [[ "$controller_handover_done" == "true" ]]; then
              return
            fi

            controller_handover_done="true"

            echo "Starting successor controller..."

            gh workflow run "$CONTROLLER_WORKFLOW" \
              --repo "$REPO" \
              --ref "$BRANCH"

            echo "Successor controller dispatched."
          }


          # ============================================================
          # GET ALL BOT RUNS
          # ============================================================

          runs_json() {
            gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/workflows/$WORKFLOW/runs?branch=$BRANCH&per_page=100" \
              --jq '.workflow_runs[]' |
            jq -s '
              [
                .[] |
                {
                  id: .id,
                  status: .status,
                  conclusion: .conclusion,
                  created_at: .created_at,
                  run_started_at: .run_started_at,
                  run_number: .run_number
                }
              ]
            '
          }


          # ============================================================
          # GET ACTIVE BOT RUNS
          # ============================================================

          active_json() {
            runs_json |
            jq '
              [
                .[] |
                select(
                  .status == "queued"
                  or .status == "in_progress"
                  or .status == "waiting"
                  or .status == "pending"
                  or .status == "requested"
                )
              ] |
              sort_by(.created_at)
            '
          }


          # ============================================================
          # GET RUN STATUS
          # ============================================================

          get_run_status() {
            local run_id="$1"

            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/runs/$run_id" \
              --jq '.status'
          }


          # ============================================================
          # CHECK BOT READY
          # ============================================================

          is_ready() {
            local run_id="$1"

            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/runs/$run_id/jobs?per_page=100" |
            jq -e '
              [
                .jobs[]?.steps[]?
                | select(
                    .name == "Verify bot ready"
                    and .conclusion == "success"
                  )
              ] |
              length > 0
            ' >/dev/null
          }


          # ============================================================
          # CANCEL BOT
          # ============================================================

          cancel_run() {
            local run_id="$1"

            echo "Cancelling bot run: $run_id"

            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/runs/$run_id/cancel" \
              >/dev/null || true
          }


          # ============================================================
          # WAIT UNTIL BOT COMPLETELY STOPS
          # ============================================================

          wait_for_stop() {
            local run_id="$1"

            echo "Waiting for run $run_id to completely stop..."

            for attempt in $(seq 1 60); do

              status="$(get_run_status "$run_id" || echo "unknown")"

              echo "Run $run_id status: $status"

              case "$status" in
                completed)
                  echo "Run $run_id has completely stopped."
                  return 0
                  ;;

                *)
                  sleep 5
                  ;;
              esac

            done

            echo "Run $run_id did not stop within the wait period."
            return 1
          }


          # ============================================================
          # STOP ALL ACTIVE BOT RUNS
          # ============================================================

          stop_all_active_bots() {
            local active="$1"

            echo "Stopping all active bot runs..."

            jq -r '.[].id' <<< "$active" |
            while read -r run_id; do

              if [[ -n "$run_id" ]]; then
                cancel_run "$run_id"
              fi

            done


            jq -r '.[].id' <<< "$active" |
            while read -r run_id; do

              if [[ -n "$run_id" ]]; then
                wait_for_stop "$run_id" || true
              fi

            done
          }


          # ============================================================
          # START
          # ============================================================

          echo "========================================"
          echo "TohidMusic Controller"
          echo "Bot watchdog: ACTIVE"
          echo "Safe session handover: ACTIVE"
          echo "Controller self-handover: ACTIVE"
          echo "========================================"


          # ============================================================
          # MAIN LOOP
          # ============================================================

          while true; do

            echo ""
            echo "========================================"
            echo "Checking TohidMusic..."
            echo "========================================"


            # ----------------------------------------------------------
            # CONTROLLER AGE
            # ----------------------------------------------------------

            controller_now="$(date -u +%s)"
            controller_age_minutes=$(( (controller_now - controller_started) / 60 ))

            echo "Controller age: ${controller_age_minutes} minutes"


            # ----------------------------------------------------------
            # CONTROLLER HANDOVER
            # ----------------------------------------------------------

            if (( controller_age_minutes >= CONTROLLER_HANDOVER_MINUTES )); then

              echo "Controller reached handover limit."

              dispatch_controller

              echo "Current controller exiting."

              exit 0
            fi


            # ----------------------------------------------------------
            # GET ACTIVE BOTS
            # ----------------------------------------------------------

            active="$(active_json)"
            count="$(jq -r 'length' <<< "$active")"

            echo "Active bot runs: $count"


            # ----------------------------------------------------------
            # NO BOT RUNNING
            # ----------------------------------------------------------

            if (( count == 0 )); then

              echo "No active bot found."

              dispatch_bot

              sleep 30

              continue
            fi


            # ----------------------------------------------------------
            # GET NEWEST BOT
            # ----------------------------------------------------------

            newest="$(jq -c 'last' <<< "$active")"

            newest_id="$(jq -r '.id // empty' <<< "$newest")"
            newest_number="$(jq -r '.run_number // empty' <<< "$newest")"
            newest_created="$(jq -r '.created_at // empty' <<< "$newest")"


            if [[ -z "$newest_id" || -z "$newest_number" || -z "$newest_created" ]]; then

              echo "Invalid bot run data."
              echo "$newest"

              sleep 30

              continue
            fi


            echo "Newest bot: #$newest_number"
            echo "Run ID: $newest_id"
            echo "Created: $newest_created"


            # ----------------------------------------------------------
            # CHECK READY
            # ----------------------------------------------------------

            if is_ready "$newest_id"; then

              echo "Bot #$newest_number is READY."


              # --------------------------------------------------------
              # If there are duplicate active runs, stop the older ones.
              # --------------------------------------------------------

              if (( count > 1 )); then

                echo "Multiple active bot runs detected."

                older_runs="$(
                  jq -c \
                    --arg target "$newest_id" \
                    '[.[] | select((.id | tostring) != $target)]' \
                    <<< "$active"
                )"

                stop_all_active_bots "$older_runs"

              fi


            else

              echo "Bot #$newest_number is NOT READY."


              # --------------------------------------------------------
              # BOT AGE
              # --------------------------------------------------------

              now="$(date -u +%s)"
              created="$(date -u -d "$newest_created" +%s)"

              age_minutes=$(( (now - created) / 60 ))

              echo "Bot age: ${age_minutes} minutes"


              # --------------------------------------------------------
              # OLD BOT / SAFE HANDOVER
              # --------------------------------------------------------

              if (( age_minutes >= BOT_HANDOVER_MINUTES )); then

                echo "========================================"
                echo "Bot #$newest_number reached handover time."
                echo "Preparing SAFE Telegram session handover."
                echo "========================================"


                # IMPORTANT:
                # Do NOT start the successor while the old bot is alive.
                # First cancel and wait for complete termination.

                stop_all_active_bots "$active"


                # Verify that no active bot remains.

                remaining="$(active_json)"
                remaining_count="$(jq -r 'length' <<< "$remaining")"

                echo "Active bots after cancellation: $remaining_count"


                if (( remaining_count == 0 )); then

                  echo "Old bot completely stopped."
                  echo "Starting successor bot..."

                  dispatch_bot

                else

                  echo "An old bot is still active."
                  echo "Will retry on next controller cycle."

                fi


                sleep 30

                continue
              fi

            fi


            # ----------------------------------------------------------
            # NORMAL WATCHDOG
            # ----------------------------------------------------------

            echo "Bot is being monitored."

            sleep 30

          done
