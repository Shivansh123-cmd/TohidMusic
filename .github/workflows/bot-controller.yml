name: TohidMusic Controller

on:
  workflow_run:
    workflows: ["Run TohidMusic"]
    types: [completed]

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: tohidmusic-controller
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Watch, restart and hand over controller
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          WORKFLOW="run-bot.yml"
          CONTROLLER_WORKFLOW="bot-controller.yml"
          BRANCH="dev"

          BOT_HANDOVER_MINUTES=335
          CONTROLLER_HANDOVER_MINUTES=335

          controller_started="$(date -u +%s)"
          controller_handover_done="false"

          echo "========================================"
          echo "TohidMusic Controller started"
          echo "Bot watchdog: ACTIVE"
          echo "Controller self-handover: ACTIVE"
          echo "========================================"


          # ------------------------------------------------------------
          # Start a new bot
          # ------------------------------------------------------------

          dispatch_bot() {
            echo "Dispatching a new bot runner..."

            gh workflow run "$WORKFLOW" \
              --repo "$REPO" \
              --ref "$BRANCH"

            echo "Bot dispatch requested."
          }


          # ------------------------------------------------------------
          # Start successor controller
          # ------------------------------------------------------------

          dispatch_controller() {
            if [[ "$controller_handover_done" == "true" ]]; then
              echo "Controller handover already requested."
              return
            fi

            controller_handover_done="true"

            echo "Starting successor controller..."

            gh workflow run "$CONTROLLER_WORKFLOW" \
              --repo "$REPO" \
              --ref "$BRANCH"

            echo "Successor controller dispatch requested."
          }


          # ------------------------------------------------------------
          # Get bot workflow runs
          # ------------------------------------------------------------

          runs_json() {
            gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/workflows/$WORKFLOW/runs?branch=$BRANCH&per_page=100" \
              --jq '.workflow_runs[]' |
            jq -s '
              [
                .[] |
                {
                  id: .id,
                  status: .status,
                  conclusion: .conclusion,
                  created_at: .created_at,
                  run_started_at: .run_started_at,
                  run_number: .run_number
                }
              ]
            '
          }


          # ------------------------------------------------------------
          # Get only active bot runs
          # ------------------------------------------------------------

          active_json() {
            runs_json |
            jq '
              [
                .[] |
                select(
                  .status == "queued"
                  or .status == "in_progress"
                  or .status == "waiting"
                  or .status == "pending"
                  or .status == "requested"
                )
              ] |
              sort_by(.created_at)
            '
          }


          # ------------------------------------------------------------
          # Check whether bot is ready
          # ------------------------------------------------------------

          is_ready() {
            local run_id="$1"

            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/runs/$run_id/jobs?per_page=100" |
            jq -e '
              [
                .jobs[]?.steps[]?
                | select(
                    .name == "Verify bot ready"
                    and .conclusion == "success"
                  )
              ] |
              length > 0
            ' >/dev/null
          }


          # ------------------------------------------------------------
          # Cancel an old bot run
          # ------------------------------------------------------------

          cancel_run() {
            local run_id="$1"

            echo "Cancelling old run: $run_id"

            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/runs/$run_id/cancel" \
              >/dev/null || true
          }


          # ============================================================
          # MAIN LOOP
          # ============================================================

          while true; do

            echo ""
            echo "----------------------------------------"
            echo "Checking controller..."
            echo "----------------------------------------"


            # ----------------------------------------------------------
            # Controller age
            # ----------------------------------------------------------

            controller_now="$(date -u +%s)"
            controller_age_minutes=$(( (controller_now - controller_started) / 60 ))

            echo "Controller age: ${controller_age_minutes} minutes"


            # ----------------------------------------------------------
            # Controller handover
            # ----------------------------------------------------------

            if (( controller_age_minutes >= CONTROLLER_HANDOVER_MINUTES )); then
              echo "Controller reached handover limit."

              dispatch_controller

              sleep 30
              continue
            fi


            # ----------------------------------------------------------
            # Get active bot runs
            # ----------------------------------------------------------

            active="$(active_json)"

            count="$(jq -r 'length' <<< "$active")"

            echo "Active bot runs: $count"


            # ----------------------------------------------------------
            # No active bot
            # ----------------------------------------------------------

            if (( count == 0 )); then
              echo "No active bot found."

              dispatch_bot

              sleep 30
              continue
            fi


            # ----------------------------------------------------------
            # Get newest active bot
            # ----------------------------------------------------------

            newest="$(jq -c 'last' <<< "$active")"

            newest_id="$(jq -r '.id // empty' <<< "$newest")"
            newest_number="$(jq -r '.run_number // empty' <<< "$newest")"
            newest_created="$(jq -r '.created_at // empty' <<< "$newest")"


            # ----------------------------------------------------------
            # Validate newest run
            # ----------------------------------------------------------

            if [[ -z "$newest_id" || -z "$newest_number" || -z "$newest_created" ]]; then
              echo "Invalid bot run information received."
              echo "$newest"

              sleep 30
              continue
            fi


            echo "Newest active bot: #$newest_number"
            echo "Run ID: $newest_id"
            echo "Created: $newest_created"


            # ----------------------------------------------------------
            # Check READY status
            # ----------------------------------------------------------

            if is_ready "$newest_id"; then

              echo "Bot #$newest_number is READY."
              echo "Cancelling older active bot runs..."


              jq -r \
                --arg target "$newest_id" \
                '.[] |
                 select((.id | tostring) != $target) |
                 .id' \
                <<< "$active" |
              while read -r old_id; do

                if [[ -n "$old_id" ]]; then
                  cancel_run "$old_id"
                fi

              done

            else

              echo "Bot #$newest_number is not READY yet."


              # --------------------------------------------------------
              # Calculate bot age
              # --------------------------------------------------------

              now="$(date -u +%s)"
              created="$(date -u -d "$newest_created" +%s)"

              age_minutes=$(( (now - created) / 60 ))

              echo "Bot age: ${age_minutes} minutes"


              # --------------------------------------------------------
              # Bot handover
              # --------------------------------------------------------

              if (( age_minutes >= BOT_HANDOVER_MINUTES )); then

                echo "Bot #$newest_number exceeded ${BOT_HANDOVER_MINUTES} minutes."
                echo "Starting successor bot..."

                dispatch_bot

                sleep 60
                continue
              fi

            fi


            # ----------------------------------------------------------
            # Watchdog interval
            # ----------------------------------------------------------

            echo "Sleeping for 30 seconds..."

            sleep 30

          done
